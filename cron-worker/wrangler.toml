# Repo is public. Only non-secret settings go here.
# GITHUB_TOKEN is a Wrangler secret: npx wrangler@4 secret put GITHUB_TOKEN
name = "class-bot-cron"
main = "src/index.js"
compatibility_date = "2026-10-01"

# Cron only. No public URL, so nothing can trigger a dispatch over HTTP.
workers_dev = false
preview_urls = false

[triggers]
# To stop: set crons = [] and redeploy. Removing this block leaves the crons live.
# Fires every 5 min. src/index.js skips ticks off the 10-min marks outside FAST_FROM..FAST_UNTIL.
crons = ["*/5 * * * *"]

[vars]
GITHUB_OWNER = "ben10gregory1"
GITHUB_REPO = "class-bot"
GITHUB_WORKFLOW = "watch.yml"
GITHUB_REF = "main"
# 5-min checks around a registration window, midnight to midnight Eastern. Change and redeploy.
FAST_FROM = "2026-11-05T05:00:00Z"
FAST_UNTIL = "2026-11-08T05:00:00Z"

[observability]
enabled = true
