name: CofC Seat Watcher

# Cadence model (proposed):
#   - Primary:  external cron (cron-job.org or Cloudflare Worker) POSTs a
#               workflow_dispatch every 5 min with NO inputs -> one pass of
#               the normal watch[] list. Dispatch runs start in ~2-11s.
#   - Fallback: GitHub schedule below. Throttled to every ~1.5-7h on this
#               repo, but costs nothing and covers an external-cron outage.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject code, e.g. BIOL"
        required: false
      course_number:
        description: "Course number, e.g. 111"
        required: false
      crns:
        description: "Specific CRNs, comma-separated"
        required: false
      async_only:
        description: "Only online-async sections?"
        required: false
        default: "false"

# Serializes runs so only one ever reads/writes state.json at a time.
# Extra triggers that arrive while one run is going sit as "pending"; a newer
# pending run may replace an older one (shows as "cancelled" in the UI --
# harmless, the newer one still runs).
concurrency:
  group: seat-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      AD_HOC_SUBJECT: ${{ github.event.inputs.subject }}
      AD_HOC_COURSE: ${{ github.event.inputs.course_number }}
      AD_HOC_CRNS: ${{ github.event.inputs.crns }}
      AD_HOC_ASYNC_ONLY: ${{ github.event.inputs.async_only }}
    steps:
      # DEDUPE FIX: check out the branch TIP at job start, not github.sha.
      # Default checkout uses the SHA from trigger time. A run that was
      # queued behind another run would otherwise load the pre-commit
      # state.json, see closed->open again, and send a second alert.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install requests

      # Scheduled (fallback): 5 passes ~50s apart. This only tightens sampling
      # inside the run; the gap between scheduled runs is still hours.
      - name: Poll loop (scheduled)
        if: github.event_name == 'schedule'
        run: |
          for i in 1 2 3 4 5; do
            echo "--- pass $i ---"
            python watch.py || echo "pass $i failed, continuing"
            if [ "$i" -lt 5 ]; then sleep 50; fi
          done

      # Dispatch: external 5-min cron (no inputs -> normal watch[] only) or a
      # manual ad-hoc run (inputs -> watch[] + one extra target). One pass.
      - name: Check once (dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: python watch.py

      - name: Commit state.json if changed
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- state.json)" ]; then
            echo "state.json unchanged"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "state: update seat tracking [skip ci]"
          # -X theirs: during a rebase "theirs" = this run's commit, i.e. the
          # state we just observed wins over an older one. Retry covers a race
          # with a manual push.
          for attempt in 1 2 3; do
            if git pull --rebase -X theirs --autostash && git push; then
              exit 0
            fi
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          echo "push failed 3x -- next run may re-alert for this change"
          exit 1
