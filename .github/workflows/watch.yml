name: CofC Seat Watcher

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      subject:
        description: "Subject code, e.g. BIOL"
        required: false
      course_number:
        description: "Course number, e.g. 111"
        required: false
      crns:
        description: "Specific CRNs, comma-separated"
        required: false
      async_only:
        description: "Only online-async sections?"
        required: false
        default: "false"

concurrency:
  group: seat-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install requests
      - name: Check for open seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          AD_HOC_SUBJECT: ${{ github.event.inputs.subject }}
          AD_HOC_COURSE: ${{ github.event.inputs.course_number }}
          AD_HOC_CRNS: ${{ github.event.inputs.crns }}
          AD_HOC_ASYNC_ONLY: ${{ github.event.inputs.async_only }}
        run: python watch.py
